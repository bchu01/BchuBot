<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BchuBot</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #1f1b16;
      --muted: #6d6458;
      --line: #e4dcd0;
      --accent: #2f5d50;
      --user: #e8efe9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 16px/1.45 system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.85rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    header p {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    button.ghost[aria-pressed="true"] {
      color: var(--accent);
      border-color: var(--accent);
    }
    #stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.7rem;
    }
    #stats.is-hidden { display: none; }
    .stat {
      display: flex;
      flex-direction: column;
      min-width: 5.4rem;
      padding: 0.35rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: var(--bg);
    }
    .stat.warn { border-color: #c9a066; }
    .stat.hot { border-color: #c45c4a; }
    .stat .label {
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .stat .value {
      font-size: 0.86rem;
      font-variant-numeric: tabular-nums;
    }
    .stat .detail {
      color: var(--muted);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
    }
    #log {
      flex: 1;
      overflow: auto;
      padding: 1rem 1.25rem 6rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      max-width: 42rem;
      padding: 0.75rem 0.9rem;
      border-radius: 0.75rem;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
    }
    .msg.bot, .msg.system {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .msg.system { color: var(--muted); font-size: 0.9rem; }
    .msg.error { border-color: #c45c4a; }
    .msg.alarm {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    #confirm {
      display: none;
      margin: 0 1.25rem 0.75rem;
      padding: 0.9rem 1rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 0.75rem;
    }
    #confirm.visible { display: block; }
    #confirm pre {
      margin: 0.5rem 0 0.75rem;
      white-space: pre-wrap;
      font-size: 0.85rem;
      color: var(--muted);
    }
    #confirm .actions { display: flex; gap: 0.5rem; }
    #progress {
      display: none;
      padding: 0.65rem 1.25rem 0.15rem;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }
    #progress.visible { display: block; }
    .progress-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    #progress-time { font-variant-numeric: tabular-nums; }
    .progress-track {
      height: 0.4rem;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 12%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.2s linear;
    }
    .progress-fill.indeterminate {
      width: 32%;
      animation: progress-slide 1.15s ease-in-out infinite;
    }
    @keyframes progress-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(360%); }
    }
    .msg.streaming {
      border-style: dashed;
    }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem 1.25rem;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }
    textarea {
      flex: 1;
      min-height: 2.75rem;
      max-height: 8rem;
      resize: vertical;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 0.6rem;
      padding: 0.65rem 1rem;
      background: var(--accent);
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button.secondary { background: var(--muted); }
    button:disabled { opacity: 0.5; cursor: default; }
    #toast {
      position: fixed;
      right: 1.25rem;
      bottom: 5.5rem;
      z-index: 30;
      display: none;
      max-width: 16rem;
      padding: 0.7rem 0.9rem;
      background: var(--accent);
      color: white;
      border-radius: 0.65rem;
      box-shadow: 0 10px 24px rgba(31, 27, 22, 0.16);
      font-size: 0.9rem;
    }
    #toast.visible {
      display: block;
      animation: toast-in 0.22s ease-out;
    }
    @keyframes toast-in {
      from { transform: translateY(8px); }
      to { transform: none; }
    }
  </style>
</head>
<body>
  <div id="toast" role="status" aria-live="polite"></div>
  <header>
    <div class="header-top">
      <div>
        <h1>BchuBot</h1>
        <p>Local assistant · stays on this computer</p>
      </div>
      <button type="button" id="stats-toggle" class="ghost" aria-pressed="true" aria-controls="stats">Hide stats</button>
    </div>
    <div id="stats" aria-live="polite">
      <div class="stat" id="stat-cpu"><span class="label">CPU</span><span class="value">—</span><span class="detail">this Mac</span></div>
      <div class="stat" id="stat-ram"><span class="label">RAM</span><span class="value">—</span><span class="detail">used / total</span></div>
      <div class="stat" id="stat-load"><span class="label">Load</span><span class="value">—</span><span class="detail">1 min / cores</span></div>
      <div class="stat" id="stat-ollama"><span class="label">Ollama</span><span class="value">—</span><span class="detail">model process</span></div>
      <div class="stat" id="stat-bchu"><span class="label">BchuBot</span><span class="value">—</span><span class="detail">this app</span></div>
      <div class="stat" id="stat-temp"><span class="label">Battery</span><span class="value">—</span><span class="detail">not CPU die</span></div>
    </div>
  </header>
  <div id="log"></div>
  <div id="confirm">
    <strong>Allow this action?</strong>
    <pre id="confirm-detail"></pre>
    <div class="actions">
      <button type="button" id="allow">Allow</button>
      <button type="button" class="secondary" id="deny">Deny</button>
    </div>
  </div>
  <div id="progress">
    <div class="progress-row">
      <span id="progress-label">Thinking…</span>
      <span id="progress-eta"></span>
      <span id="progress-time">0.0s</span>
    </div>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div id="progress-fill" class="progress-fill indeterminate"></div>
    </div>
  </div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message BchuBot" autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const confirmBox = document.getElementById("confirm");
    const confirmDetail = document.getElementById("confirm-detail");
    const progress = document.getElementById("progress");
    const progressLabel = document.getElementById("progress-label");
    const progressEta = document.getElementById("progress-eta");
    const progressTime = document.getElementById("progress-time");
    const progressFill = document.getElementById("progress-fill");
    const toast = document.getElementById("toast");
    const ws = new WebSocket(`ws://${location.host}/ws`);
    let busy = false;
    let streamEl = null;
    let progressStarted = 0;
    let progressTicker = null;
    let progressPhase = "thinking";
    const replyTimes = JSON.parse(localStorage.getItem("bchubot-reply-times") || "[]");

    function typicalReplySeconds() {
      if (!replyTimes.length) return null;
      return replyTimes.reduce((sum, value) => sum + value, 0) / replyTimes.length;
    }

    function rememberReplyTime(seconds) {
      if (!(seconds > 0)) return;
      replyTimes.push(seconds);
      if (replyTimes.length > 8) replyTimes.shift();
      localStorage.setItem("bchubot-reply-times", JSON.stringify(replyTimes));
    }

    function formatSeconds(value) {
      return value.toFixed(1) + "s";
    }

    function updateProgressClock() {
      const elapsed = (Date.now() - progressStarted) / 1000;
      progressTime.textContent = formatSeconds(elapsed);
      const typical = typicalReplySeconds();
      if (typical) {
        const remaining = Math.max(0, typical - elapsed);
        progressEta.textContent = remaining > 0.5
          ? "usually ~" + formatSeconds(typical) + " left ~" + formatSeconds(remaining)
          : "usually ~" + formatSeconds(typical);
      } else {
        progressEta.textContent = "no estimate yet";
      }
      if (progressPhase === "writing") {
        const fraction = typical
          ? Math.min(0.9, elapsed / Math.max(typical, 1))
          : 1 - Math.exp(-elapsed / 8);
        progressFill.style.width = Math.round(12 + fraction * 78) + "%";
      }
    }

    function startProgress(label) {
      progressPhase = "thinking";
      progressStarted = Date.now();
      progressLabel.textContent = label;
      progressFill.className = "progress-fill indeterminate";
      progressFill.style.width = "";
      progress.classList.add("visible");
      updateProgressClock();
      if (!progressTicker) progressTicker = setInterval(updateProgressClock, 100);
    }

    function setProgressPhase(phase, label) {
      progressPhase = phase;
      if (label) progressLabel.textContent = label;
      else if (phase === "writing") progressLabel.textContent = "Writing…";
      else progressLabel.textContent = "Thinking…";
      if (phase === "writing") {
        progressFill.className = "progress-fill";
        updateProgressClock();
      } else {
        progressFill.className = "progress-fill indeterminate";
        progressFill.style.width = "";
      }
    }

    function stopProgress() {
      const elapsed = progressStarted ? (Date.now() - progressStarted) / 1000 : 0;
      rememberReplyTime(elapsed);
      progressFill.className = "progress-fill";
      progressFill.style.width = "100%";
      progressLabel.textContent = "Done";
      if (progressTicker) {
        clearInterval(progressTicker);
        progressTicker = null;
      }
      setTimeout(() => {
        progress.classList.remove("visible");
        progressFill.style.width = "";
      }, 350);
    }

    function add(role, text) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function setBusy(value) {
      busy = value;
      send.disabled = value;
      if (!value && progressTicker) stopProgress();
    }

    function appendStream(text) {
      if (!streamEl) {
        streamEl = add("bot", "");
        streamEl.classList.add("streaming");
      }
      streamEl.textContent += text;
      log.scrollTop = log.scrollHeight;
      setProgressPhase("writing");
    }

    function finishStream(text) {
      const finalText = text || "(No reply)";
      if (streamEl) {
        streamEl.textContent = finalText;
        streamEl.classList.remove("streaming");
        streamEl = null;
      } else {
        add("bot", finalText);
      }
      stopProgress();
      setBusy(false);
      notifyDone();
    }

    function hideConfirm() {
      confirmBox.classList.remove("visible");
    }

    function beep() {
      playTones([[880, 0, 0.22]]);
    }

    function notifyDone() {
      showToast("BchuBot is done");
      playTones([[523.25, 0, 0.16], [783.99, 0.14, 0.32]], 0.40, "triangle");
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("visible");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("visible"), 3200);
    }

    let audioCtx = null;

    function unlockAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    window.addEventListener("pointerdown", unlockAudio);
    window.addEventListener("keydown", unlockAudio);

    function playTones(notes, volume, type) {
      const ctx = unlockAudio();
      if (!ctx) return;
      const startAt = () => {
        const now = ctx.currentTime;
        const peak = volume == null ? 0.08 : volume;
        const wave = type || "sine";
        notes.forEach(([freq, start, duration]) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, now + start);
          gain.gain.linearRampToValueAtTime(peak, now + start + 0.025);
          gain.gain.linearRampToValueAtTime(0, now + start + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + start);
          osc.stop(now + start + duration + 0.03);
        });
      };
      if (ctx.state === "suspended") ctx.resume().then(startAt);
      else startAt();
    }

    ws.addEventListener("open", () => add("system", "Connected."));
    ws.addEventListener("close", () => {
      add("system", "Disconnected. Refresh the page.");
      streamEl = null;
      setBusy(false);
    });
    ws.addEventListener("message", (event) => {
      const data = JSON.parse(event.data);
      if (data.type === "status") {
        add("system", data.text);
        if (streamEl && data.text && data.text.indexOf("Using ") === 0) {
          streamEl.remove();
          streamEl = null;
        }
        if (busy) setProgressPhase("thinking", data.text);
      }
      if (data.type === "progress") {
        setProgressPhase(data.phase === "writing" ? "writing" : "thinking");
      }
      if (data.type === "token") appendStream(data.text || "");
      if (data.type === "reply") finishStream(data.text);
      if (data.type === "error") {
        streamEl = null;
        add("error", data.text || "Something went wrong.");
        setBusy(false);
      }
      if (data.type === "alarm") {
        add("alarm", data.text || "Timer done.");
        beep();
      }
      if (data.type === "confirm") {
        confirmDetail.textContent =
          data.tool + "\n" + JSON.stringify(data.arguments || {}, null, 2);
        confirmBox.classList.add("visible");
      }
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || busy || ws.readyState !== WebSocket.OPEN) return;
      add("user", text);
      unlockAudio();
      ws.send(JSON.stringify({ type: "message", text }));
      input.value = "";
      setBusy(true);
      startProgress("Thinking…");
    });

    function answer(allow) {
      hideConfirm();
      ws.send(JSON.stringify({ type: "confirm", allow }));
    }
    document.getElementById("allow").onclick = () => answer(true);
    document.getElementById("deny").onclick = () => answer(false);

    function heatClass(value, warnAt, hotAt) {
      if (value == null) return "";
      if (value >= hotAt) return "hot";
      if (value >= warnAt) return "warn";
      return "";
    }

    function setStat(id, value, detail, extraClass) {
      const el = document.getElementById(id);
      el.querySelector(".value").textContent = value;
      if (detail) el.querySelector(".detail").textContent = detail;
      el.className = "stat" + (extraClass ? " " + extraClass : "");
    }

    function formatGb(used, total) {
      if (used == null || total == null) return "—";
      return used.toFixed(1) + " / " + total.toFixed(1) + " GB";
    }

    function formatProcess(proc) {
      if (!proc || !proc.running) return { value: "off", detail: "not running" };
      const ram = proc.memory_mb >= 1024
        ? (proc.memory_mb / 1024).toFixed(1) + " GB"
        : Math.round(proc.memory_mb) + " MB";
      return {
        value: proc.cpu_percent.toFixed(1) + "%",
        detail: ram + " RAM",
      };
    }

    const statsBox = document.getElementById("stats");
    const statsToggle = document.getElementById("stats-toggle");
    let statsOn = localStorage.getItem("bchubot-stats") !== "off";
    let statsTimer = null;

    function applyStatsVisibility() {
      statsBox.classList.toggle("is-hidden", !statsOn);
      statsToggle.setAttribute("aria-pressed", statsOn ? "true" : "false");
      statsToggle.textContent = statsOn ? "Hide stats" : "Show stats";
      localStorage.setItem("bchubot-stats", statsOn ? "on" : "off");
      if (statsOn) {
        refreshStats();
        if (!statsTimer) statsTimer = setInterval(refreshStats, 1000);
      } else if (statsTimer) {
        clearInterval(statsTimer);
        statsTimer = null;
      }
    }

    statsToggle.addEventListener("click", () => {
      statsOn = !statsOn;
      applyStatsVisibility();
    });

    async function refreshStats() {
      if (!statsOn) return;
      try {
        const response = await fetch("/stats");
        if (!response.ok) return;
        const data = await response.json();
        let ramHeat = "";
        if (data.memory_unused_gb != null && data.memory_unused_gb < 0.25) ramHeat = "hot";
        else if (data.memory_unused_gb != null && data.memory_unused_gb < 0.6) ramHeat = "warn";
        setStat(
          "stat-cpu",
          data.cpu_percent == null ? "—" : data.cpu_percent.toFixed(1) + "%",
          "this Mac",
          heatClass(data.cpu_percent, 70, 90)
        );
        setStat(
          "stat-ram",
          formatGb(data.memory_used_gb, data.memory_total_gb),
          data.memory_unused_gb == null
            ? "used / total"
            : data.memory_unused_gb.toFixed(1) + " GB unused",
          ramHeat
        );
        setStat(
          "stat-load",
          data.load_1m == null ? "—" : data.load_1m.toFixed(2),
          (data.cpu_count || "?") + " cores",
          heatClass(data.cpu_count ? data.load_1m / data.cpu_count * 100 : null, 70, 100)
        );
        const ollama = formatProcess(data.ollama);
        setStat(
          "stat-ollama",
          ollama.value,
          ollama.detail,
          heatClass(data.ollama && data.ollama.cpu_percent, 40, 80)
        );
        const bchu = formatProcess(data.bchubot);
        setStat("stat-bchu", bchu.value, bchu.detail);
        setStat(
          "stat-temp",
          data.battery_c == null ? "—" : data.battery_c.toFixed(1) + "°C",
          "battery, not CPU",
          heatClass(data.battery_c, 38, 43)
        );
      } catch (_err) {
        /* Keep the last reading if a poll fails. */
      }
    }

    applyStatsVisibility();

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
